services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: simbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simbg}
      POSTGRES_USER: ${POSTGRES_USER:-simbg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - simbg-postgres-data:/var/lib/postgresql
    networks:
      - apap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: simbg-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - apap-network

  grafana:
    image: grafana/grafana:latest
    container_name: simbg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - apap-network

networks:
  apap-network:
    name: apap-network

volumes:
  simbg-postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
